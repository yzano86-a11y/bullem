name: Verify Bull 'Em (Independent)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: verification-bullem

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test shared
        run: npm test -w shared

      - name: Test server
        run: npm test -w server

      - name: Test client
        run: npm test -w client
